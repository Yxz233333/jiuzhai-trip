<!doctype html><html lang="zh-CN" data-mode="static"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#123d42"><title>小夜的九寨同行 · 国庆旅行手册</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body>
<div id="login" class="login"><div class="login-photo"><img src="/landscape.jpg" alt="九寨沟五花海风景参考，非实时雪况"><div class="photo-caption">九寨沟 · 五花海<br>风景参考，2026年5月摄</div></div><main class="login-panel"><a class="brand" href="/">九寨同行 <span>JIUZHAI / 2026</span></a><div class="login-copy"><p class="eyebrow">小夜的国庆旅行</p><h1>先去成都，<br>再走进山水。</h1><p>查看每天的计划和备选方案，<br>在每一站留下想法，一起等旅途的照片。</p><form id="loginForm"><label for="code">访问码</label><div class="input-row"><input id="code" type="password" inputmode="numeric" autocomplete="current-password" required placeholder="输入访问码" maxlength="32"><button type="submit">进入行程 ↗</button></div><p id="loginError" role="alert"></p></form></div><small>朋友们可以评论，评论经小夜审核后展示。</small></main></div>
<div id="workspace" hidden><header class="topbar"><a class="brand" href="#days">九寨同行 <span>小夜 / 2026</span></a><div class="top-actions"><span id="version"></span><span id="role"></span><button id="refresh" class="text-button">刷新</button><button id="logout" class="text-button">退出</button></div></header><nav class="nav" aria-label="旅行导航"><a href="#days">每日行程</a><a href="#choices">方案选择</a><a href="#budget">费用预算</a><a href="#checklist">出发检查</a><a href="#notes">同行标注</a><a href="#news">更新公告</a><a href="#journal">游玩公告</a></nav><main id="main"><section class="trip-heading"><div><p class="eyebrow" id="dates"></p><h1 id="title"></h1><p id="subtitle"></p></div><div class="heading-image"><img src="/landscape.jpg" alt="五花海参考风景"><span>五花海 · 风景参考</span></div></section><div id="constraints" class="constraints"></div><aside id="notice" class="notice"></aside><div id="view"></div><footer><p>GitHub静态游记 · 评论与在线修改已关闭。未选方案保留作参考，后续照片由小夜更新。</p><a href="https://commons.wikimedia.org/wiki/File:Five_Flower_Lake_20260511-6.jpg" target="_blank" rel="noopener">五花海照片：Suicasmo / Wikimedia Commons · CC0</a><p id="sync"></p></footer></main></div>
<dialog id="noteDialog"><form id="noteForm"><div class="dialog-head"><p id="formKind" class="eyebrow">留下想法</p><button type="button" id="closeDialog" class="text-button" aria-label="关闭">✕</button></div><h2 id="formTitle">写一条标注</h2><p id="noteTarget"></p><blockquote id="quotePreview" hidden></blockquote><label for="author">怎么称呼你</label><input id="author" maxlength="30" placeholder="例如：小夜、同行朋友" required><label for="noteBody">你的想法</label><textarea id="noteBody" required maxlength="2000" rows="5" placeholder="对这一站的建议，或者想对小夜说的话。"></textarea><div class="dialog-bottom"><span id="chars">0 / 2000</span><button id="submitNote" type="submit">提交</button></div><p id="noteError" role="alert"></p><p id="formHint" class="muted"></p></form></dialog><dialog id="branchDialog" aria-labelledby="branchTitle"><div class="branch-dialog-content"><p class="eyebrow">切换前看一下</p><h2 id="branchTitle"></h2><div id="branchImpact"></div><p id="branchError" role="alert"></p><div class="links"><button type="button" id="cancelBranch" class="secondary">保持当前分支</button><button type="button" id="confirmBranch">确认切换</button></div></div></dialog><div id="toast" role="status" hidden></div></body></html>
